<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LootSwap</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b0e14;
  color: #f4f6fb;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #141a25;
}
.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}
.brand {
  font-size: 25px;
  font-weight: 900;
}
.brand span { color: #5ce1c2; }
.panel {
  background: #171e2b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}
h1 { font-size: 42px; }
p { color: #a5afc0; line-height: 1.6; }
input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0 14px;
  border-radius: 8px;
  border: 1px solid #39465c;
  background: #0e1420;
  color: white;
}
button {
  padding: 12px 17px;
  background: #5ce1c2;
  color: #10131c;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
  gap: 15px;
}
.listing {
  background: #171e2b;
  padding: 17px;
  border-radius: 13px;
  border: 1px solid #293346;
}
.status { color: #5ce1c2; }
.notice {
  padding: 14px;
  background: #201d38;
  border-radius: 10px;
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">Loot<span>Swap</span></div>
  </div>
</header>

<main class="wrap">

<section>
  <h1>Trade your loot.<br>Find your next upgrade.</h1>
  <p>Discover gaming trades and connect with other players.</p>
  <div class="notice">
    Only trade items permitted by each game's rules.
    Never share passwords or account access.
  </div>
</section>

<section class="panel">
  <h2>Browse listings</h2>
  <input id="search" placeholder="Search listings...">
  <select id="filter">
    <option value="">All games</option>
    <option>ARK: Survival Ascended</option>
    <option>Fortnite</option>
    <option>Rainbow Six Siege</option>
    <option>Other permitted game</option>
  </select>
  <div id="listings" class="grid">Loading...</div>
</section>

<section class="panel">
  <h2>Create a listing</h2>
  <form id="listingForm">
    <label>Game</label>
    <select id="game" required>
      <option value="">Choose game</option>
      <option>ARK: Survival Ascended</option>
      <option>Fortnite</option>
      <option>Rainbow Six Siege</option>
      <option>Other permitted game</option>
    </select>

    <label>Item you're offering</label>
    <input id="item" required maxlength="70">

    <label>Description</label>
    <textarea id="description" maxlength="400"></textarea>

    <label>What are you looking for?</label>
    <input id="wanted" required maxlength="150">

    <button type="submit">Create listing</button>
    <div id="formStatus" class="status"></div>
  </form>
</section>

<section class="panel">
  <h2>Your account</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (8+ characters)">
  <button type="button" id="signup">Sign up</button>
  <button type="button" id="signin">Sign in</button>
  <button type="button" id="signout">Sign out</button>
  <div id="authStatus" class="status"></div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_KEY.includes("PASTE_");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const $ = id => document.getElementById(id);
let listings = [];

function safe(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function render() {
  const search = $("search").value.toLowerCase();
  const game = $("filter").value;

  const results = listings.filter(x =>
    (!game || x.game === game) &&
    [x.game,x.item_name,x.description,x.looking_for]
      .join(" ").toLowerCase().includes(search)
  );

  $("listings").innerHTML = results.length
    ? results.map(x => `
      <article class="listing">
        <h3>${safe(x.item_name)}</h3>
        <p>${safe(x.game)}</p>
        <p>${safe(x.description)}</p>
        <p>Looking for: ${safe(x.looking_for)}</p>
      </article>
    `).join("")
    : "<p>No listings found yet.</p>";
}

async function loadListings() {
  if (!db) {
    $("listings").textContent = "Supabase setup required.";
    return;
  }

  const {data,error} = await db.from("listings")
    .select("id,game,item_name,description,looking_for,created_at")
    .order("created_at",{ascending:false})
    .limit(100);

  if (error) {
    $("listings").textContent = "Could not load listings.";
    return;
  }

  listings = data || [];
  render();
}

async function auth(action) {
  if (!db) {
    $("authStatus").textContent = "Supabase is not connected.";
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 8) {
    $("authStatus").textContent = "Enter a valid email and password of at least 8 characters.";
    return;
  }

  const result = action === "signup"
    ? await db.auth.signUp({email,password})
    : await db.auth.signInWithPassword({email,password});

  $("authStatus").textContent = result.error
    ? result.error.message
    : "Request successful. Check your email if confirmation is required.";
}

$("signup").onclick = () => auth("signup");
$("signin").onclick = () => auth("signin");

$("signout").onclick = async () => {
  if (!db) return;
  await db.auth.signOut();
  $("authStatus").textContent = "Signed out.";
};

$("listingForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    $("formStatus").textContent = "Supabase is not connected.";
    return;
  }

  const {data} = await db.auth.getUser();

  if (!data.user) {
    $("formStatus").textContent = "Please sign in first.";
    return;
  }

  const listing = {
    game: $("game").value,
    item_name: $("item").value.trim(),
    description: $("description").value.trim(),
    looking_for: $("wanted").value.trim(),
    user_id: data.user.id
  };

  const {error} = await db.from("listings").insert(listing);

  if (error) {
    $("formStatus").textContent = error.message;
    return;
  }

  $("listingForm").reset();
  $("formStatus").textContent = "Listing created!";
  await loadListings();
});

$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);

if (db) loadListings();
else $("listings").textContent = "Supabase setup required.";
</script>

</body>
</html>
